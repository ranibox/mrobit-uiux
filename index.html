<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mROBIT To-be · 글로벌 셸 + Start Hub (동작 시안)</title>
<style>
:root{
  --fs-title:24px; --fs-section:18px; --fs-panel:15px; --fs-body:14px; --fs-label:13px; --fs-caption:12px; --fs-micro:11px; --fs-kpi:32px;
  --hdr:#383d44; --hdr-2:#454b53; --hdr-text:#e5e7eb; --hdr-dim:#aab2bd;
  --bg:#e9eef4; --surface:#ffffff; --panel-hdr:#deebfe; --line:#cbd5de; --line-soft:#e3e9f0;
  --text:#1a1a1a; --text-2:#4b5563; --text-3:#6b7280;
  --accent:#4370ff; --accent-soft:#e8eeff;
  --ok:#44cc16; --warn:#ff9900; --danger:#ff3b30;
  --motion-fast:120ms; --motion-base:200ms; --motion-slow:300ms; --ease:cubic-bezier(0.2,0,0,1);
  --font: "Pyeojin Gothic", PyeojinGothic, Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:var(--fs-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Global header (A) ===== */
.gh{height:56px;background:var(--hdr);color:var(--hdr-text);display:flex;align-items:center;padding:0 16px 0 0;gap:8px;position:relative;z-index:50}
.brand{display:flex;flex-direction:column;justify-content:center;height:56px;padding:0 20px;min-width:148px;border-right:1px solid #4d535b;text-align:left;transition:background var(--motion-fast)}
.brand:hover{background:var(--hdr-2)}
.brand b{font-size:17px;font-weight:800;letter-spacing:.2px;color:#fff;line-height:1.1}
.brand small{font-size:var(--fs-micro);color:var(--hdr-dim);font-weight:500}
.nav{display:flex;align-items:center;height:56px;margin-left:8px}
.nav-item{position:relative;height:56px;display:flex;align-items:center}
.nav-btn{height:36px;padding:0 14px;border-radius:8px;font-size:var(--fs-body);font-weight:600;color:var(--hdr-text);display:flex;align-items:center;gap:6px;transition:background var(--motion-fast)}
.nav-btn:hover,.nav-item.open .nav-btn{background:var(--hdr-2)}
.nav-btn .chev{font-size:10px;color:var(--hdr-dim);transition:transform var(--motion-base) var(--ease)}
.nav-item.open .chev{transform:rotate(180deg)}
.nav-btn .lbl{position:relative;display:inline-flex;align-items:center;gap:6px}
.nav-item.active .nav-btn .lbl::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:3px;border-radius:3px 3px 0 0;background:#8fb0ff;box-shadow:0 0 8px rgba(143,176,255,.45)}
.nav-item.active .nav-btn{color:#fff}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(68,204,22,.18)}
.live-dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(255,153,0,.2)}
.menu{position:absolute;top:52px;left:0;min-width:240px;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.18),0 0 0 1px rgba(15,23,42,.06);padding:8px;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity var(--motion-base) var(--ease),transform var(--motion-base) var(--ease)}
.nav-item.open .menu{opacity:1;transform:none;pointer-events:auto}
.menu.cols{display:grid;grid-template-columns:1fr 1fr;min-width:440px;gap:4px}
.menu h6{font-size:var(--fs-caption);color:var(--text-3);font-weight:700;letter-spacing:.2px;padding:8px 4px 6px;margin:0 6px 4px;border-bottom:1px solid var(--line-soft)}
.menu.cols{column-gap:12px}
.menu a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;font-size:var(--fs-body);color:var(--text);text-decoration:none;transition:background var(--motion-fast)}
.menu a:hover{background:#f1f5fb}
.menu a.cur{color:var(--accent);font-weight:600}
.menu a.cur::after{content:"✓";font-size:12px}
.gh-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.search{width:340px;height:36px;border-radius:10px;background:#2c3036;border:1px solid #545a62;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--hdr-dim);font-size:var(--fs-label);transition:border-color var(--motion-fast),background var(--motion-fast)}
.search:hover{border-color:#7a828c}
.search kbd{margin-left:auto;font:600 var(--fs-micro) var(--font);background:#454b53;color:#d1d5db;border-radius:5px;padding:2px 6px}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--hdr-text);transition:background var(--motion-fast);position:relative}
.icon-btn:hover{background:var(--hdr-2)}
.badge{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bitbox{height:36px;padding:0 12px 0 8px;border-radius:10px;background:#0d233b;display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-label);color:#fff}
.bitbox i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cfe0ff,#4370ff 70%)}
.bitbox em{font-style:normal;font-size:10px;background:var(--accent);border-radius:4px;padding:1px 5px}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;border-radius:8px;transition:background var(--motion-fast)}
.user-btn:hover{background:var(--hdr-2)}
.user-btn .ava{width:28px;height:28px;border-radius:50%;background:#5b6470;display:grid;place-items:center;font-size:12px;font-weight:700}
.user-btn span{display:flex;flex-direction:column;text-align:left;line-height:1.2}
.user-btn b{font-size:var(--fs-label);font-weight:600}
.user-btn small{font-size:var(--fs-micro);color:var(--hdr-dim)}
.user .menu{left:auto;right:0;min-width:280px}
.user.open .menu{opacity:1;transform:none;pointer-events:auto}
.radio{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:var(--fs-body)}
.radio:hover{background:#f1f5fb}
.radio input{accent-color:var(--accent);width:16px;height:16px}
.radio small{display:block;color:var(--text-3);font-size:var(--fs-caption)}
.sep{height:1px;background:var(--line-soft);margin:6px 4px}

/* ===== Body layout ===== */
.app{display:flex;height:calc(100vh - 56px)}
.rail{width:56px;background:#fff;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;flex-shrink:0}
.rail button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);position:relative;transition:background var(--motion-fast),color var(--motion-fast)}
.rail button:hover{background:#f1f5fb}
.rail button.on{background:var(--accent-soft);color:var(--accent)}
.rail button .tip{position:absolute;left:48px;white-space:nowrap;background:#1f2937;color:#fff;font-size:var(--fs-caption);padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity var(--motion-fast);z-index:5}
.rail button:hover .tip{opacity:1}
.rail .div{width:24px;height:1px;background:var(--line-soft);margin:6px 0}
.lnav{width:248px;background:#fff;border-right:1px solid var(--line-soft);overflow:hidden;flex-shrink:0;transition:width var(--motion-base) var(--ease)}
.lnav.closed{width:0;border-right:0}
.lnav-inner{width:248px;height:100%;display:flex;flex-direction:column}
.lnav-hd{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid var(--line-soft);background:#f7faff}
.lnav-hd b{font-size:var(--fs-panel);font-weight:600}
.lnav-hd button{width:28px;height:28px;border-radius:6px;color:var(--text-3)}
.lnav-hd button:hover{background:#eef2f8}
.lnav-body{flex:1;overflow:auto;padding:8px}
.lnav-body h6{font-size:var(--fs-caption);color:var(--text-3);font-weight:600;padding:12px 8px 6px}
.lnav-body a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--text-2);font-size:var(--fs-body);text-decoration:none;transition:background var(--motion-fast),color var(--motion-fast)}
.lnav-body a:hover{background:#f1f5fb;color:var(--text)}
.lnav-body a.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc a .n{font-size:var(--fs-caption);color:var(--text-3);width:20px}
.toc a .cnt{margin-left:auto;font-size:var(--fs-micro);font-weight:700;background:#fff3e0;color:#b45f00;border-radius:10px;padding:1px 7px}
.tag-row{display:flex;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer}
.tag-row:hover{background:#f1f5fb}
.tag-row b{font-size:var(--fs-label);font-weight:700;font-variant-numeric:tabular-nums;display:block}
.tag-row small{font-size:var(--fs-caption);color:var(--text-3)}
.select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-body);margin-bottom:8px;background:#fff}
.field{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:var(--fs-label);margin-bottom:6px}

main{flex:1;overflow:auto;position:relative}
.view{min-height:100%;animation:viewIn var(--motion-base) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page{padding:20px 28px 40px;max-width:1440px}
.crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-label);color:var(--text-3);margin-bottom:8px}
.crumb a{color:var(--text-3);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.crumb .cur{color:var(--text);font-weight:600}
.ptitle{font-size:var(--fs-title);font-weight:700;line-height:32px}
.pdesc{font-size:var(--fs-body);color:var(--text-2);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px}
.sec-title{font-size:var(--fs-section);font-weight:600;line-height:26px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.tbl th{font-size:var(--fs-label);color:var(--text-2);font-weight:600;text-align:left;padding:10px 12px;background:#f7faff;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.tbl tr:hover td{background:#fafcff}
.tbl .id{color:var(--accent);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:var(--fs-caption);font-weight:600;border-radius:10px;padding:2px 8px;background:#eafbe3;color:#2f8a0e}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:var(--fs-label);font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background var(--motion-fast),transform var(--motion-fast)}
.btn:hover{background:#f5f8fc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#3360ee}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px;gap:8px}
.empty .ic{width:48px;height:48px;border-radius:12px;background:#f1f5fb;display:grid;place-items:center;color:var(--text-3);margin-bottom:4px}
.empty b{font-size:var(--fs-section);font-weight:600}
.empty p{font-size:var(--fs-body);color:var(--text-2)}

/* workspace */
.ws{position:relative;display:flex;padding:8px;height:calc(100vh - 56px);min-height:0}
.wbox{display:flex;min-width:0;min-height:0;flex:1 1 0}
.wbox.row{flex-direction:row}.wbox.col{flex-direction:column}
.wbox>.pane,.wbox>.wbox{flex:1 1 0;min-width:0;min-height:0}
.split{flex:0 0 8px;position:relative;z-index:3}
.split.v{cursor:col-resize}.split.h{cursor:row-resize}
.split::after{content:"";position:absolute;border-radius:2px;background:transparent;transition:background var(--motion-fast)}
.split.v::after{left:3px;width:2px;top:30%;bottom:30%}.split.h::after{top:3px;height:2px;left:30%;right:30%}
.split:hover::after,.split.drag::after{background:var(--accent)}
body.resizing{user-select:none}body.resizing .canvas canvas{pointer-events:none}
.ptabs{display:flex;gap:2px;padding:0 0 6px}
.ptab{height:30px;padding:0 12px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px;font-size:var(--fs-label);font-weight:600;color:var(--text-2);background:transparent;border:1px solid transparent}
.ptab svg{color:var(--text-3)}
.ptab.on{background:var(--surface,#fff);border-color:var(--line-soft);color:var(--text)}
.ptab.on svg{color:var(--accent)}
.pane.hidden{display:none}
.pane{background:#fff;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.pane-hd{height:32px;flex:0 0 32px;display:flex;align-items:center;gap:7px;padding:0 6px 0 10px;background:var(--panel-hdr);font-size:13px;font-weight:600;color:var(--text);border-bottom:1px solid var(--line-soft)}
.pane-hd .pi{color:var(--accent);display:grid;place-items:center}
.pane-hd .x{margin-left:auto;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);cursor:pointer;transition:background var(--motion-fast),color var(--motion-fast)}
.pane-hd .x:hover{background:rgba(15,23,42,.08);color:var(--text)}
.mini-empty .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft,#eaf0ff);color:var(--accent);margin-bottom:4px}
.vtools{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line-soft);background:#f3f7fc}
.vtools span{font-size:var(--fs-caption);color:var(--text-2);padding:6px 8px;border-radius:6px}
.vtools span.on{background:#d7e6ff;color:var(--accent);font-weight:600}
.canvas{flex:1;background:#7f8a8f center/cover no-repeat;position:relative;min-height:0;overflow:hidden}
.canvas canvas{position:absolute;inset:0;display:block}
.canvas .hint{z-index:2}
.bgsel{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:var(--fs-caption);color:var(--text-2)}
.bgsel b{font-weight:600;margin-right:4px}
.bgsel button{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:var(--fs-caption);font-weight:600;color:var(--text-2);transition:background var(--motion-fast),color var(--motion-fast)}
.bgsel button:hover{background:#f1f5fb}
.bgsel button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.bgdesc{position:absolute;right:10px;top:10px;z-index:2;background:rgba(255,255,255,.92);font-size:var(--fs-caption);padding:6px 10px;border-radius:8px;max-width:520px;color:var(--text)}
.hint{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);font-size:var(--fs-caption);padding:4px 8px;border-radius:6px}
.side-stack{display:grid;grid-template-rows:1fr 1fr;gap:8px;min-height:0}
/* D4 뷰 내비게이터 — 항상 노출, 축소형 (기존 방식 유지) */
.vnav{position:relative;width:106px;height:110px}
.vnav .vc{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:6px;display:grid;place-items:center;border:1.5px solid transparent;transition:transform var(--motion-fast) var(--ease),background var(--motion-fast)}
.vnav .vc:hover{transform:scale(1.15);background:rgba(255,255,255,.55)}
.vnav .vc.on{background:rgba(232,239,255,.9);border-color:var(--accent)}
.vnav .vc svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.vnav .vcen{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;background:rgba(236,240,245,.88);color:#5b6470;box-shadow:0 2px 8px rgba(15,23,42,.2);transition:background var(--motion-fast),color var(--motion-fast)}
.vnav .vcen:hover{background:#fff;color:var(--accent)}
.vnav .vcen.on{box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(15,23,42,.2);color:var(--accent)}
.vnav [data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;background:#1f2937;color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;pointer-events:none;z-index:5}
body.dark .vnav .vcen{background:rgba(23,33,48,.9);color:#b6c0cd}
/* 탐색 도구: 미니맵 + 뷰 내비게이터 (우측 상단 한 묶음) */
.navstack{position:absolute;right:10px;top:10px;z-index:4;display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-end;gap:8px;pointer-events:none}
.navstack>*{pointer-events:auto}
.mmap{position:relative;width:180px;height:118px;background:rgba(255,255,255,.9);border:1px solid rgba(15,23,42,.12);border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.14);overflow:hidden;cursor:crosshair;transition:opacity var(--motion-base),transform var(--motion-base)}
.mm-lb{position:absolute;left:6px;top:4px;font-size:10px;font-weight:700;color:var(--text-3);pointer-events:none}
#mmSvg{display:block;width:100%;height:100%}
.navstack .off{display:none}
@keyframes mmPulse{0%{r:5;opacity:.9}100%{r:14;opacity:0}}
#mmSel .pulse{animation:mmPulse 1.4s ease-out infinite;fill:none;stroke:var(--accent);stroke-width:1.5}
body.dark .mmap{background:rgba(23,33,48,.9);border-color:var(--line)}
/* P&ID 도면 + 3D 렌즈 (S02-E-01) */
.ptool{height:34px;flex:0 0 34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border-bottom:1px solid var(--line-soft);background:var(--surface,#fff);font-size:var(--fs-caption);color:var(--text-2);position:relative;z-index:3}
.ptool .dn{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ptool .dn svg{color:var(--text-3);flex:0 0 auto}
.ptool .tb{width:26px;height:26px}
.ptool.p3{background:var(--surface,#fff)}
.lens-sw{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap;padding:3px 6px;border-radius:6px}
.lens-sw .sw{width:28px;height:16px;border-radius:8px}.lens-sw .sw::after{width:12px;height:12px}
.lens-sw.on{color:var(--accent);background:#e8eeff}.lens-sw.on .sw{background:var(--accent)}.lens-sw.on .sw::after{transform:translateX(12px)}
.solo-tip{display:none;align-items:center;gap:6px;white-space:nowrap;color:var(--text-3)}
.solo-tip button{font-size:var(--fs-caption);font-weight:700;color:var(--accent);padding:2px 6px;border-radius:5px}
.solo-tip button:hover{background:#e8eeff}
.pane.lens-on:not(.solo) .solo-tip{display:flex}
.lens-cfg{position:fixed;z-index:300;width:250px;background:var(--surface,#fff);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.2),0 0 0 1px var(--line-soft);padding:12px;display:none;font-size:var(--fs-caption);color:var(--text-2)}
.lens-cfg.open{display:block}
.lens-cfg b{display:block;font-size:var(--fs-label);color:var(--text);margin-bottom:8px}
.lc-row{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.seg{display:flex;background:#eef2f7;border-radius:7px;padding:2px}
.seg button{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;color:var(--text-2)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lens-cfg p{margin-top:8px;line-height:16px;color:var(--text-3)}
.dwg{flex:1;position:relative;min-height:0;background:#fbfcfe;overflow:hidden}
.dwg>svg{position:absolute;inset:0;width:100%;height:100%}
.dwg .sym{cursor:pointer}
.dwg svg .ln,.dwg svg .sh{vector-effect:non-scaling-stroke;stroke-width:1.2px}
.dwg svg .frame{vector-effect:non-scaling-stroke;stroke-width:1px}
.dwg .sym:hover .ln,.dwg .sym:hover .sh{stroke:#4370ff}
.dwg .sym.hl .sh{stroke:#4370ff;stroke-width:2px;fill:rgba(67,112,255,.12)}
.dwg .sym.hl text{fill:#4370ff;font-weight:700}
.dwg .sym.inlens .sh{fill:rgba(67,112,255,.08)}
.pane.lens-on .dwg{cursor:crosshair}

/* ===== BITBOX (S90-G) ===== */
:root{--ai:linear-gradient(135deg,#4370ff 0%,#7c5cff 100%);--ai-1:#4370ff;--ai-2:#7c5cff}
.bot{--s:48px;display:block;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:0 0 var(--s);
  background:radial-gradient(circle at 34% 26%,#f1f5ff 0,#b8cbff 16%,#6f93ff 44%,#4268f0 72%,#2f49c9 100%);
  box-shadow:inset calc(var(--s)*-.08) calc(var(--s)*-.12) calc(var(--s)*.22) rgba(20,36,140,.35),0 calc(var(--s)*.12) calc(var(--s)*.3) rgba(67,112,255,.35);
  animation:botBreath 4s ease-in-out infinite}
.bot .eyes{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;gap:calc(var(--s)*.17);transition:transform .3s var(--ease)}
.bot .eyes i{display:block;width:calc(var(--s)*.085);height:calc(var(--s)*.16);border-radius:99px;background:#17204a;animation:botBlink 5.2s infinite;transform-origin:50% 50%}
.bot::after{content:"";position:absolute;inset:calc(var(--s)*-.12);border-radius:50%;opacity:0;transition:opacity .25s}
@keyframes botBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes botBlink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.12)}}
.bot.think::after{opacity:1;background:conic-gradient(from 0deg,transparent 0 40%,#7c5cff 70%,#4370ff 100%);-webkit-mask:radial-gradient(circle,transparent calc(50% - 2.5px),#000 calc(50% - 2px));mask:radial-gradient(circle,transparent calc(50% - 2.5px),#000 calc(50% - 2px));animation:botSpin 1.1s linear infinite}
.bot.think .eyes{animation:botLook 1.6s ease-in-out infinite}
@keyframes botSpin{to{transform:rotate(360deg)}}
@keyframes botLook{0%,100%{transform:translate(-62%,-56%)}50%{transform:translate(-38%,-56%)}}
.bot.talk{animation:botTalk 1.2s ease-in-out infinite}
@keyframes botTalk{0%,100%{box-shadow:inset -4px -6px 12px rgba(20,36,140,.35),0 6px 16px rgba(67,112,255,.35)}50%{box-shadow:inset -4px -6px 12px rgba(20,36,140,.35),0 0 0 6px rgba(124,92,255,.18),0 8px 24px rgba(124,92,255,.45)}}
.bot.listen::after{opacity:1;border:2px solid rgba(67,112,255,.5);animation:botPing 1.2s ease-out infinite}
@keyframes botPing{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.bot.alert::after{opacity:1;border:2px solid #ff9900;animation:botPing 1.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){.bot,.bot .eyes i,.bot::after{animation:none!important}}

.bitbox.on{background:#16305a;box-shadow:0 0 0 1px rgba(124,92,255,.6) inset}

/* conversation */
.msg-u{display:flex;justify-content:flex-end;margin:4px 0 14px}
.msg-u div{max-width:84%;background:#eef2f8;color:var(--text);padding:9px 12px;border-radius:14px 14px 4px 14px;font-size:var(--fs-label);line-height:20px}
.msg-u .ctx{display:block;font-size:10px;font-weight:700;color:var(--accent);margin-bottom:2px}
.msg-a{display:flex;gap:10px;margin-bottom:18px}
.msg-a>.bot{--s:26px;animation:none;margin-top:2px}
.msg-a .ab{flex:1;min-width:0}
.aisteps{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:#f6f7fd;border:1px solid #e7e9fb;margin-bottom:10px}
.aisteps .st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);opacity:.45;transition:opacity .2s}
.aisteps .st.on,.aisteps .st.done{opacity:1}
.aisteps .st.on{color:var(--text)}
.aisteps .st i{width:14px;height:14px;border-radius:50%;flex:0 0 14px;border:2px solid #cfd5f6;position:relative}
.aisteps .st.on i{border-color:#7c5cff;border-right-color:transparent;animation:botSpin .8s linear infinite}
.aisteps .st.done i{border:0;background:var(--ai)}
.aisteps .st.done i::after{content:"";position:absolute;left:4.5px;top:2.5px;width:3px;height:6px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.aisteps .st small{margin-left:auto;font-size:10px;color:var(--text-3)}
.aisteps.fold{padding:6px 10px;cursor:pointer}
.aisteps.fold .st{display:none}
.aisteps .ssum{display:none;font-size:11px;font-weight:600;color:var(--text-3);align-items:center;gap:6px}
.aisteps.fold .ssum{display:flex}
.ans{font-size:var(--fs-body);line-height:23px;color:var(--text)}
.ans b{font-weight:700}
.ans .w{color:#e07c00;font-weight:800}
.ans .caret{display:inline-block;width:2px;height:15px;background:#7c5cff;vertical-align:-2px;margin-left:1px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.ev-hd{display:flex;align-items:center;gap:6px;margin:14px 0 8px;font-size:11px;font-weight:700;color:var(--text-3)}
.ev-hd .conf{margin-left:auto;display:flex;align-items:center;gap:4px;color:#2e9a10}
.ev-hd .conf i{width:6px;height:6px;border-radius:50%;background:#44cc16}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ev{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;border:1px solid var(--line-soft);background:var(--surface,#fff);text-align:left;min-width:0;cursor:pointer;transition:border-color var(--motion-fast),box-shadow var(--motion-fast),transform var(--motion-fast) var(--ease);animation:fadeUp .28s var(--ease) both}
.ev:hover,.ev.hot{border-color:#8f7bff;box-shadow:0 4px 14px rgba(124,92,255,.18);transform:translateY(-1px)}
.ev .n{width:18px;height:18px;border-radius:6px;background:var(--ai);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:0 0 18px}
.ev .t{min-width:0}
.ev b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small svg{flex:0 0 auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spnote{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:10px;background:linear-gradient(90deg,rgba(67,112,255,.08),rgba(124,92,255,.08));font-size:12px;color:var(--text-2);animation:fadeUp .28s var(--ease) both}
.spnote svg{color:#6b5cff}
.spnote button{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-3);padding:2px 6px;border-radius:5px}
.spnote button:hover{background:rgba(255,255,255,.7);color:var(--text)}
.acts2{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;animation:fadeUp .28s var(--ease) both}
.acts2 button{height:32px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--text);background:var(--surface,#fff);display:flex;align-items:center;gap:6px}
.acts2 button.pri{background:var(--ai);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(91,95,242,.3)}
.acts2 button:hover{border-color:#8f7bff}
.fups{display:flex;flex-direction:column;gap:4px;margin-top:12px;animation:fadeUp .28s var(--ease) both}
.fups button{text-align:left;font-size:12px;font-weight:600;color:#5b5ff2;padding:4px 0;display:flex;align-items:center;gap:6px}
.fups button:hover{text-decoration:underline}
.fb{display:flex;gap:2px;margin-top:10px;color:var(--text-3)}
.fb button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--text-3)}
.fb button:hover{background:#eef3fb;color:var(--text)}
.fb button.on{color:var(--accent)}
/* composer */
.bbx-cmp{padding:10px 12px 12px;border-top:1px solid var(--line-soft)}
.cmp{border-radius:14px;border:1px solid var(--line);background:var(--surface,#fff);padding:8px 8px 8px 10px;transition:border-color var(--motion-fast),box-shadow var(--motion-fast)}
.cmp:focus-within{border-color:transparent;box-shadow:0 0 0 1.5px #7c5cff,0 6px 20px rgba(91,95,242,.15)}
.cmp textarea{width:100%;border:0;outline:0;resize:none;font:inherit;font-size:var(--fs-body);line-height:20px;height:40px;background:transparent;color:var(--text)}
.cmp-r{display:flex;align-items:center;gap:6px}
.cmp-r .mode{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:#f1f0ff;color:#5b5ff2;font-size:11px;font-weight:700}
.cmp-r .mic,.cmp-r .send{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.cmp-r .mic:hover{background:#eef3fb;color:var(--text)}
.cmp-r .send{margin-left:0;background:var(--ai);color:#fff;box-shadow:0 4px 12px rgba(91,95,242,.3)}
.cmp-r .send:disabled{background:#e3e6ee;color:#9aa4b2;box-shadow:none}
.bbx-foot{font-size:10px;color:var(--text-3);text-align:center;margin-top:6px}
/* orb in 3D */
.aorb{position:absolute;right:20px;bottom:76px;z-index:6;cursor:pointer;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.aorb .bot{--s:50px}
.aorb .say{position:absolute;right:56px;top:6px;white-space:nowrap;background:#fff;color:var(--text);font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px 10px 2px 10px;box-shadow:0 6px 18px rgba(15,23,42,.18);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none}
.aorb.saying .say{opacity:1;transform:none}
.aorb.away .say{right:auto;left:-6px;top:-34px;border-radius:10px 10px 10px 2px}
.aorb .tip{position:absolute;right:0;bottom:58px;white-space:nowrap;background:#1f2937;color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
.aorb:hover .tip{opacity:1}
.aorb.away .tip{display:none}
/* spatial callouts */
.aicall{position:absolute;inset:0;pointer-events:none;z-index:5}
.aic{--lift:0px;position:absolute;transform:translate(-50%,calc(-100% - 46px - var(--lift)));transition:--lift .2s;pointer-events:auto;min-width:150px;max-width:220px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-radius:12px;padding:8px 10px 9px;box-shadow:0 10px 28px rgba(31,26,110,.22),0 0 0 1px rgba(124,92,255,.35);animation:aicIn .35s var(--ease) both;cursor:pointer}
.aic::before{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:calc(40px + var(--lift));background:linear-gradient(#7c5cff,rgba(124,92,255,.15));transform:translateX(-50%)}
.aic::after{content:"";position:absolute;left:50%;top:calc(100% + 40px + var(--lift));width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ai);box-shadow:0 0 0 4px rgba(124,92,255,.25);animation:aicDot 1.6s ease-out infinite}
@keyframes aicIn{from{opacity:0;transform:translate(-50%,calc(-100% - 36px)) scale(.96)}to{opacity:1;transform:translate(-50%,calc(-100% - 46px - var(--lift)))}}
@keyframes aicDot{0%{box-shadow:0 0 0 0 rgba(124,92,255,.45)}100%{box-shadow:0 0 0 12px rgba(124,92,255,0)}}
.aic .h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--text)}
.aic .h .n{width:16px;height:16px;border-radius:5px;background:var(--ai);color:#fff;font-size:10px;display:grid;place-items:center}
.aic .v{font-size:13px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;color:var(--text)}
.aic .v.w{color:#e07c00}
.aic small{display:block;font-size:10px;color:var(--text-3);margin-top:1px}
.aic.hot{box-shadow:0 12px 32px rgba(31,26,110,.3),0 0 0 2px #7c5cff;z-index:2}
.aic.off{display:none}
.ailink{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120}
.ailink path{fill:none;stroke:url(#aiGrad);stroke-width:2;stroke-dasharray:6 5;animation:dash 0.8s linear infinite;filter:drop-shadow(0 0 4px rgba(124,92,255,.5))}
.ailink circle{fill:#7c5cff}
@keyframes dash{to{stroke-dashoffset:-22}}
.dwg .sym.ai .sh{stroke:#7c5cff;stroke-width:2.2px;fill:rgba(124,92,255,.12);animation:symAi 1.6s ease-in-out infinite}
.dwg .sym.ai text{fill:#5b5ff2;font-weight:700}
@keyframes symAi{50%{fill:rgba(124,92,255,.24)}}
body.dark .msg-u div{background:#223047}body.dark .aisteps{background:#1b2338;border-color:#2b3456}body.dark .ctxchip{background:#1f2d52;border-color:#35508a}
body.dark .sugg .si{background:#262a55}body.dark .aic,body.dark .aorb .say{background:rgba(23,33,48,.96)}body.dark .cmp-r .mode{background:#262a55;color:#b3a8ff}
body.dark .bbx-hd .acts button:hover,body.dark .fb button:hover{background:var(--hover)}

/* start hub */
#main.m-start{background:linear-gradient(180deg,#dde3f3 0,#e9edf7 220px,#f6f8fc 460px,#ffffff 720px) #fff;background-attachment:local}
.hub{max-width:1200px;margin:0 auto;padding:28px 32px 56px}
.hsec-ws{margin-top:48px}
.hub{isolation:isolate}
.hub-top{position:relative;display:flex;justify-content:center;align-items:center;min-height:48px;margin-top:12px}
.hub-top .switch{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:0;padding:0;gap:8px;font-size:var(--fs-caption);color:var(--text-3)}
.hub-top .switch .sw{width:28px;height:16px;border-radius:8px}.hub-top .switch .sw::after{width:12px;height:12px}.hub-top .switch.on .sw::after{transform:translateX(12px)}
.hub h1{font-size:34px;font-weight:700;line-height:42px;letter-spacing:-.3px;text-align:center}
.hub .ctx{font-size:var(--fs-label);color:var(--text-2);margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hub .ctx.sys{font-variant-numeric:tabular-nums;color:var(--text-3)}.hub .ctx.sys i{width:1px;height:10px;background:var(--line)}
.switch{display:flex;align-items:center;gap:10px;font-size:var(--fs-label);color:var(--text-2);background:#fff;border:1px solid var(--line-soft);border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;user-select:none;transition:border-color var(--motion-fast)}
.switch:hover{border-color:var(--line)}
.sw{width:36px;height:20px;border-radius:10px;background:#c7ced8;position:relative;transition:background var(--motion-base) var(--ease)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform var(--motion-base) var(--ease)}
.switch.on .sw{background:var(--accent)}
.switch.on .sw::after{transform:translateX(16px)}
.hsearch{position:relative;margin:28px auto 0;max-width:880px;height:56px;border-radius:999px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 10px 0 22px;font-size:16px;color:var(--text-3);transition:border-color var(--motion-base)}
.hsearch::before{content:"";position:absolute;left:8%;right:8%;bottom:-8px;height:22px;border-radius:999px;background:linear-gradient(90deg,rgba(67,112,255,.7),rgba(67,112,255,.62) 50%,rgba(110,100,255,.5) 78%,rgba(160,110,255,.32));filter:blur(14px);opacity:.55;z-index:-1;pointer-events:none;transition:opacity var(--motion-base) var(--ease)}
.hsearch:hover{border-color:#b9c7e6}.hsearch:hover::before{opacity:.7}
.hsearch .mic{border-radius:999px}
.hsearch kbd{margin-left:auto;font:600 var(--fs-caption) var(--font);background:#f1f5fb;border:1px solid var(--line-soft);border-radius:6px;padding:3px 8px;color:var(--text-2)}
.mic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#f1f5fb;color:var(--text-2)}
.chips{display:flex;gap:8px;margin:14px auto 0;max-width:880px;flex-wrap:wrap;align-items:center;justify-content:center}
.chips small{font-size:var(--fs-caption);color:var(--text-3)}
.chip{font-size:var(--fs-label);background:#f2f4f8;border:1px solid #d3dbe5;border-radius:999px;padding:4px 12px;color:var(--text-2);font-variant-numeric:tabular-nums;transition:border-color var(--motion-fast),color var(--motion-fast)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.hsec{margin-top:36px}
.hsec-hd{display:flex;align-items:center;gap:12px;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.hsec-hd h2{font-size:var(--fs-caption);font-weight:700;color:var(--text-2);letter-spacing:.2px}
.hsec-hd .meta{margin-left:auto;font-size:var(--fs-caption);color:var(--text-3);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.hsec-hd .meta .live-dot{width:6px;height:6px}
.hsec-hd .htabs{margin-left:auto;display:flex;gap:16px}
.hsec-hd .htab{font-size:var(--fs-caption);font-weight:600;color:var(--text-3);padding:2px 0;position:relative;transition:color var(--motion-fast)}
.hsec-hd .htab:hover{color:var(--text)}
.hsec-hd .htab.on{color:var(--text)}
.hsec-hd .htab.on::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:2px;background:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:2px 20px 4px;background:none;border:0;border-radius:0;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0;padding-left:4px}
.kpi .kh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpi small{font-size:var(--fs-label);color:var(--text-2);font-weight:600}
.kpi b{display:block;font-size:30px;font-weight:700;line-height:36px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:var(--fs-caption);color:var(--text-3)}
.hub-row{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:12px}
.hub-row .card{box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.04)}
.hub-row .brief{flex-direction:row;align-items:center;justify-content:space-between;padding:14px 18px;gap:12px}
.hub-row .bl{display:flex;flex-direction:column;gap:2px}
.hub-row .bt{font-size:var(--fs-section);font-weight:700}
.hub-row .pt{font-style:normal;color:var(--accent)}
.hub-row .path{padding:14px 18px}
.hub-row .path b{font-size:var(--fs-section);font-weight:700}
.hub-row .path:hover .arr{color:var(--accent);transform:translateX(2px)}
.path .arr{transition:transform var(--motion-fast) var(--ease),color var(--motion-fast)}
.brief{display:flex}
.brief .lbl{display:flex;align-items:center;gap:8px;font-size:var(--fs-caption);font-weight:600;color:var(--text-3)}
.brief h3{font-size:var(--fs-section);font-weight:600;line-height:26px}
.brief .meta{display:flex;gap:16px;font-size:var(--fs-body);color:var(--text-2)}
.brief .meta b{font-weight:700;color:var(--text);margin-left:2px}.brief h3 .pt{font-style:normal;color:var(--accent)}
.brief .go{align-self:flex-start;margin-top:auto}
.paths{display:grid;grid-template-rows:repeat(3,1fr);gap:8px}
.path{display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;transition:transform var(--motion-fast) var(--ease),box-shadow var(--motion-fast),border-color var(--motion-fast)}
.path:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08);border-color:#c9d6ee}
.path .pi{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-caption)}
.path b{font-size:var(--fs-panel);font-weight:600;display:block}
.path small{font-size:var(--fs-label);color:var(--text-2)}
.path .arr{margin-left:auto;color:var(--text-3)}
.tabs{display:flex;gap:6px;margin:24px 0 10px}
.tab{font-size:var(--fs-label);font-weight:600;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line-soft);color:var(--text-2)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.wcard{overflow:hidden;text-align:left;transition:transform var(--motion-fast) var(--ease),box-shadow var(--motion-fast)}
.wcard:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(15,23,42,.10)}
.wthumb{height:120px;background:#dfe7f1 center/cover no-repeat;position:relative}
.wthumb.pid{background:#fff repeating-linear-gradient(0deg,transparent 0 23px,#eef2f7 23px 24px),#fff}
.wthumb.pid::before{content:"";position:absolute;inset:24px 30px;border:2px solid #4b5563;border-radius:4px}
.wthumb.pid::after{content:"";position:absolute;left:60px;top:44px;width:36px;height:36px;border:2px solid #4370ff;border-radius:50%;box-shadow:80px 10px 0 -6px #fff,80px 10px 0 -4px #4b5563}
.wthumb.doc{background:linear-gradient(#f7faff,#f7faff)}
.wthumb.doc::before{content:"";position:absolute;left:50%;top:16px;width:72px;height:92px;margin-left:-36px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.wthumb.brief2{background:linear-gradient(135deg,#eef3ff,#dfe8ff)}
.wthumb.brief2::before{content:"Live Brief";position:absolute;left:14px;top:14px;font-size:var(--fs-caption);font-weight:700;color:var(--accent)}
.wcard .wb{padding:12px 14px}
.wcard b{font-size:var(--fs-panel);font-weight:600;display:block}
.wcard small{font-size:var(--fs-caption);color:var(--text-3)}

/* live brief */
.lb{max-width:1200px;padding:24px 32px 48px}
.lb .tagline{display:flex;gap:8px;align-items:center;font-size:var(--fs-label);color:var(--text-2)}
.lb .tagline em{font-style:normal;font-size:var(--fs-micro);font-weight:700;background:#fde8e6;color:#c4271d;border-radius:4px;padding:2px 6px}
.lb h1{font-size:30px;font-weight:700;line-height:40px;margin-top:10px}
.lb h1 mark{background:none;color:var(--accent)}
.lb .lead{font-size:var(--fs-body);color:var(--text-2);margin-top:10px;max-width:760px;line-height:22px}
.lbk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}
.lbk .card{padding:14px}
.lbk small{font-size:var(--fs-label);font-weight:600;color:var(--text-2)}
.lbk b{display:block;font-size:var(--fs-kpi);font-weight:700;line-height:38px;margin-top:4px;font-variant-numeric:tabular-nums}
.lbk b i{font-style:normal;font-size:var(--fs-label);color:var(--text-3);font-weight:500;margin-left:2px}
.lbk span{font-size:var(--fs-caption);color:var(--text-3)}
.lbk .warn{border-color:#ffd8a3;background:#fffaf2}
.lbk .warn b{color:#c46a00}
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.dec .card{padding:16px}
.dec .k{font-size:var(--fs-caption);font-weight:700;color:var(--accent)}
.dec b{display:block;font-size:var(--fs-panel);font-weight:600;margin:6px 0}
.dec p{font-size:var(--fs-label);color:var(--text-2);line-height:19px}
.disp-btn{position:absolute;top:20px;right:28px}
.display-mode .lb{zoom:1.25}

/* shift hub */
.sh-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.sh-kpi .card{padding:14px 16px}
.sh-kpi small{font-size:var(--fs-label);color:var(--text-2)}
.sh-kpi b{display:block;font-size:var(--fs-section);font-weight:700;margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.steps .card{padding:14px}
.steps .n{font-size:var(--fs-caption);font-weight:700;color:var(--accent)}
.steps b{display:block;font-size:var(--fs-body);font-weight:600;margin:4px 0}

const NOTES={
 'S00-1-01':{t:'로그인 화면 정리',ch:'라이트/다크 테마 토글 삭제. 태그라인·로고·입력만 남김. 배경 비주얼(복잡함의 해결)은 S00-1-02에서 별도 제작.',mo:'로그인 후 시작 화면 설정에 따라 Start Hub / 마지막 화면 / Live Brief로 이동.',em:'L1',dev:'로그인 성공 후 리다이렉트 대상 = 사용자 설정 startPref.'},
 'S90-A-01':{t:'글로벌 헤더 통일 (셸 3종 → 1종)',ch:'워크스페이스·하위 페이지·Live Brief가 각자 쓰던 헤더를 하나로 통일. 하위 페이지의 [뒤로가기 + 가운데 페이지 선택 드롭다운] 제거, 메인 메뉴를 모든 화면에서 항상 노출.',mo:'섹션을 옮겨도 헤더는 고정, 본문만 fade+4px 상승(--motion-base).',em:'L1 — 바뀌는 건 본문뿐이라는 안정감',dev:'공통 Layout 컴포넌트 하나로 라우팅. Live Brief도 같은 레이아웃 사용(전용 헤더 폐기). 헤더 높이 56px.'},
 'S90-A1-01':{t:'로고 = 홈(Start Hub)',ch:'로고 클릭 시 항상 Start Hub로 이동.',mo:'즉시 이동.',em:'L0',dev:'Start Hub를 시작 화면으로 쓰지 않는 사용자도 로고로는 언제든 진입 가능.'},
 'S90-A2-01':{t:'Live Brief 위치: 로고 옆 → 메인 메뉴 첫 항목',ch:'로고 옆 강조 버튼(홈처럼 보임)을 메인 메뉴 첫 항목으로 이동. 앞에 상태 점 표시.',mo:'점은 정적. 정상 #44cc16 / 주의 발생 시 #ff9900로 색만 바뀜(루프 애니메이션 없음).',em:'L0 — 상태만 조용히 알림',dev:'점 색은 Live Brief의 주의 건수 > 0 여부로 결정. 메뉴 우측 하단 3px 액센트 바로 현재 섹션 표시.'},
 'S02-C1-01':{t:'탐색 패널 범위 선택',ch:'드롭다운 순서를 태그 → 3D → 도면 → 문서 → 위치 → 내 폴더로 변경. 태그가 기본이자 첫 항목. 선택 항목은 블루 배경 + 체크.',mo:'열기/닫기 즉시(L0), 화살표 180° 회전 120ms.',em:'L0',dev:'기본 범위 = 태그. 마지막 선택 범위는 사용자별로 기억.'},
 'S02-C3-01':{t:'태그 트리 — 연결 자료 펼치기',ch:'태그 앞 # 표시 삭제. 태그를 펼치면 그 태그의 3D 객체·문서·도면 목록이 나온다(3D 객체 클릭 시 3D 줌인). 카테고리는 작은 회색 라벨(폴더 아이콘 + 이름 + 건수 배지), 파일은 아이콘 + 파일명(13px Medium) 한 줄, 긴 이름은 말줄임. 세로 가이드 라인 1개로 계층 표시. 파일 클릭 시 해당 뷰어(P&ID·문서)가 열리며 닫혀 있던 패널은 자동으로 다시 열림.',mo:'펼침 화살표 90° 회전 120ms.',em:'L0',dev:'태그-문서/도면 매핑 API 사용(현재 사이트 구현). 연결 자료가 없으면 "연결된 자료 없음" 표시.'},
 'S90-G-02':{t:'BITBOX 패널 — 맥락 중심 구조',ch:'헤더: 캐릭터(오브) + BITBOX AI + 연결 상태 점. API 배지·온톨로지 문구 등 기술 정보는 숨기고, 상단에 [맥락 칩](선택 설비명 · 태그 · 참조 소스 3D/도면/문서/운전) 1줄. 첫 화면은 인사 + 선택 설비 기준 추천 질문 3개(5개 → 3개). 폭 400px, 워크스페이스를 밀어내며 열림(가리지 않음).',mo:'패널 열림 280ms, 추천 카드 hover 1px 상승.',em:'L1',dev:'헤더 BITBOX 버튼 · 3D 오브 · Ctrl+J로 열기. 연결 실패 시 상태 점 주황 + \"AI 서버 연결 필요\" 한 줄(설정화면 링크는 관리자에게만).'},
 'S90-D6-02':{t:'BITBOX 오브(웸빗 펫) — 상태 표현',ch:'기존 구 캐릭터에 눈을 살려 5가지 상태: 대기(4초 주기 약한 호흡 + 가끔 눈 깜빡임) / 듣기(링 확산) / 생각 중(블루→보라 링 회전 + 눈이 좌우로) / 답변 중(보라 글로우 맥박) / 경보(주황 링). 답이 공간 근거를 가지면 오브가 해당 말풍선 옆으로 날아가 \"여기예요\" 후 복귀. 헤더·패널·3D 오브가 같은 상태를 공유.',mo:'이동 700ms cubic-bezier(.3,.7,.2,1), 말풍선 2.5초. OS 동작 줄이기 시 모든 루프 정지.',em:'L2',dev:'CSS만으로 구현(이미지 불필요), 크기는 --s 변수 하나. 기존 \"드래그해 객체에 놓으면 그 객체를 질문\" 기능 유지.'},
 'S90-G-01':{t:'공간 답변 — 3D·도면 위 말풍선',ch:'답변에 위치 근거가 있으면 채팅창 밖, 실제 설비 위에 번호 말풍선(설비명 · 핵심 수치 · 한 줄 해석)을 띄운다. 수치 경고는 주황. 동시에 도면 기호도 보라 맥박 강조, 첫 번째 근거로 3D 줌인. 패널에 \"근거 위치 n곳 표시 · 지우기\". 3D가 없는 화면이면 [3D에서 보기]로 이동.',mo:'말풍선 순차 등장 120ms 간격, 앵커 점 맥박 1.6초.',em:'L2',dev:'말풍선 좌표 = 태그 3D 바운딩 박스 상단 → 화면 투영, 매 프레임 갱신(DOM 오버레이, 3D 재렌더 없음). 화면 밖이면 숨김.'},
 'S90-G-03':{t:'근거 칩 + 연결선',ch:'답변 아래 근거를 유형별 칩으로(운전 데이터 · 3D 객체 · 도면 · 문서 · 영향 그래프 · 자재). 칩 번호 = 공간 말풍선 번호. 칩에 마우스를 올리면 패널에서 해당 말풍선까지 보라 점선 연결선이 그려지고 둘 다 강조. 클릭하면 그 설비로 이동/해당 뷰어 열기. 우측에 \"근거 n건 · 신뢰도\".',mo:'칩 순차 등장 60ms, 연결선 흐르는 점선.',em:'L1',dev:'근거 없는 답변은 표시하지 않는 것이 원칙(환각 방지). 신뢰도는 근거 수·출처 유형 기반 규칙.'},
 'S90-G6-01':{t:'생각 단계 → 답변 스트리밍',ch:'질문 직후 \"맥락 수집 → 도면 토폴로지 → 문서·이력 → 운전 데이터\" 단계를 체크하며 진행 상황을 보여주고, 끝나면 한 줄로 접힘(\"4단계로 확인했어요 · 펼쳐 보기\"). 답변은 글자 단위로 흘러나오고 보라 커서 표시.',mo:'단계당 약 0.5초(실제는 서버 이벤트), 스트리밍 16ms.',em:'L2',dev:'단계명은 서버 이벤트(tool call) 이름을 사용자 언어로 매핑. 단계 시간은 실제 처리 시간.'},
 'S90-G-04':{t:'답변 → 바로 실행',ch:'답변 끝에 업무로 이어지는 버튼(주 행동 1개는 AI 그라데이션): 작업지시 초안 만들기 · 예비 펌프 전환 검토 · Live Brief에 추가 등. 아래 후속 질문 2개, 피드백(좋아요·아쉬워요·복사).',mo:'페이드업 280ms.',em:'L1',dev:'액션은 권한에 따라 노출. 작업지시는 초안만 만들고 확정은 사용자.'},
 'S90-G-05':{t:'맥락 칩 · 입력창',ch:'탐색 트리·3D·도면에서 설비를 선택하면 맥락 칩이 자동으로 바뀌고 추천 질문도 그 설비 기준으로 바뀐다. ✕로 맥락 해제. 입력창: 자리표시 \"CCWP A에 대해 물어보세요\", 모드 칩(온톨로지 질의), 음성, 보내기(AI 그라데이션). Enter 보내기 / Shift+Enter 줄바꿈. 하단 고지 \"근거와 함께 답해요 · 최종 판단은 운영 절차를 따르세요\".',mo:'입력창 포커스 시 보라 링.',em:'L1',dev:'맥락은 대화 단위로 고정(질문 말풍선에 @설비명 표시).'},
 'S02-E-01':{t:'도면 위 3D 렌즈 (선택 영역의 차원 변화)',ch:'P&ID 뷰어 툴바 [3D 렌즈] 스위치를 켜고 도면에서 영역을 드래그하면, 그 안의 태그만 3D로 보여주는 팝업 렌즈가 선택 영역 옆에 뜬다(별도 패널 아님). 선택 밖 설비는 반투명(또는 숨김). 렌즈가 켜져 있어도 도면 휠 확대/축소·우클릭 드래그 이동 가능. 렌즈 안에서 드래그로 회전, [3D 뷰어에서 보기]로 메인 3D로 이동, ✕ 또는 스위치 끄기로 닫기. 렌즈 이름은 "띄우는 결과물" 기준(도면에서 3D를 띄우면 3D 렌즈, 3D에서 도면을 띄우면 도면 렌즈). 도면이 화면을 단독으로 차지할 때 가장 잘 보이며, 아닐 때는 [단독 보기] 안내.',mo:'렌즈 등장 scale .94→1 + 페이드 200ms, 자동 회전(설정).',em:'L2',dev:'설정(⚙): 선택 밖 설비 반투명/숨김, 렌즈 크기 작게·보통·크게, 자동 회전 켜기/끄기 — 사용자별 저장. 영역→태그는 도면 기호 좌표, 태그→3D 객체는 매핑 테이블(3D 객체 목록) 사용. P&ID는 논리 구조이므로 실제 구현은 공간 범위가 아니라 선택 태그 기준으로 3D를 구성.'},
 'S02-E-02':{t:'3D 위 도면 렌즈 (3D → 도면)',ch:'3D 뷰어 툴바 아래 타이틀 바(모델명 · 계통)의 [도면 렌즈] 스위치를 켜고(⚙ 설정은 3D 렌즈와 공통, P&ID 뷰어와 같은 형태) 3D에서 영역을 드래그하면, 화면에 보이는 그 영역의 태그를 기준으로 해당 P&ID 부분을 팝업 렌즈로 띄운다. 선택 태그 기호는 블루 강조, 나머지는 흐리게(설정: 숨김). [도면 뷰어에서 보기]로 P&ID 뷰어에 강조 상태로 이동. 렌즈가 켜진 동안 왼쪽 드래그만 영역 선택으로 바뀌고, 휠 확대/축소·우클릭 드래그 이동은 그대로 동작. 팝업 도면도 휠·드래그·[+ − ⤢] 버튼으로 확대/축소/이동.',mo:'렌즈 등장 200ms. 버튼 다시 누르면 렌즈 모드 해제.',em:'L2',dev:'태그 기준: 3D 객체 → 태그 → 도면 기호 매핑. 여러 도면에 걸치면 도면별 탭(2차). 렌즈 설정(⚙)은 3D 렌즈와 공유.'},
 'S02-E-03':{t:'렌즈 태그 목록 — 많을 때',ch:'렌즈 하단 바: [유형 요약(설비 4 · 밸브 2)] + [칩 최대 3개 + "+N"] + [목록]. +N 또는 목록을 누르면 렌즈 오른쪽에 태그 목록 패널(검색 · 유형 필터 · 스크롤)이 열린다. 목록에서 태그를 누르면 트리·3D·도면이 함께 선택.',mo:'목록 패널 즉시 표시.',em:'L0',dev:'칩은 화면 폭과 관계없이 최대 3개. 100개 이상은 가상 스크롤. 유형은 태그 분류 코드 기준.'},
 'S02-P-01':{t:'도면 ↔ 3D 매핑',ch:'3D 모델에 해당하는 P&ID 도면(9-36610-LM-105-901)을 P&ID 뷰어에 표시. 도면 기호를 누르면 해당 태그가 선택되고, 3D ⇄ 도면 동기화가 켜져 있으면 3D가 그 설비로 줌인 + 미니맵 표시 + 탐색 트리 선택. 반대로 탐색 트리·3D에서 선택하면 도면 기호가 블루로 강조.',mo:'강조 즉시, 3D 줌인 600ms.',em:'L1',dev:'도면 기호 ↔ 태그 ↔ 3D 객체 매핑 테이블(EPnID 객체화 결과) 사용. 동기화 스위치는 독의 [3D ⇄ 도면].'},
 'S02-D3-02':{t:'미니맵 — 넓은 현장에서 지금 위치 파악',ch:'넓고 복잡한 3D·도면을 탐색할 때 전체 대비 현재 위치를 보여준다. 표현은 회색 단색(배관·설비 윤곽)만, 강조색 없음. 주황 점 = 지금 보고 있는 지점. 태그를 선택하면 3D가 해당 설비로 줌인하고 미니맵은 그 설비 영역을 블루 점선 박스 + 점(맥박 효과)으로 가리킨다. 미니맵을 클릭하면 그 위치로 시점 이동. 박스는 1겹(맵 영역 = 미니맵 박스).',mo:'줌인 600ms, 클릭 이동 300ms ease-out. 선택 점 맥박 1.4초 반복(선택 중에만).',em:'L1',dev:'평면도는 모델 바운딩 박스 기준 탑뷰(직교 카메라 렌더 또는 배치도 이미지). 태그→좌표는 3D 객체 바운딩 박스 중심. 보이기/숨기기는 툴바 [탐색 도구] 그룹, 사용자별 저장.'},
 'S02-D3-03':{t:'탐색 도구 배치 — 우측 상단 한 묶음',ch:'뷰 내비게이터(왼쪽)와 미니맵(오른쪽)을 3D 영역 우측 상단에 가로로 묶어 배치. 미니맵 우측 상단 ✕로 닫으면 뷰 내비게이터가 오른쪽 끝으로 붙는다. 좌상단은 조작 힌트, 하단 중앙은 플로팅 독이 쓰므로 겹치지 않는다. 툴바에 [탐색 도구] 그룹 신설: 미니맵 · 뷰 내비게이터 보기/숨기기 토글.',mo:'토글 즉시 표시/숨김.',em:'L0',dev:'둘 다 끄면 묶음 영역 전체가 사라짐. 패널이 좁아도(최소 140px) 겹치지 않게 우측 정렬.'},
 'S02-D4-01':{t:'D4 뷰 내비게이터 — 축소형 (항상 노출)',ch:'기존 방식(가운데 등각 버튼 + 주변 6방향 큐브)을 그대로 유지하고 크기만 축소: 전체 약 180×180px → 약 106×110px, 가운데 원 40px, 방향 큐브 20px(터치 영역 26px). 6방향: 위·좌·우·정면·후면·아래. 현재 시점은 블루 테두리로 표시, 마우스를 올리면 시점 이름 툴팁.',mo:'큐브 hover 1.15배 120ms, 카메라 이동 300ms ease-out.',em:'L1',dev:'3D 캔버스 우측 상단, 미니맵 아래(S02-D3-03). 카메라는 현재 거리 유지, 방향만 변경. 툴바·독과 겹치지 않게 배치.'},
 'S02-D5-01':{t:'D5 플로팅 독',ch:'콘텐츠 영역 하단 중앙에 떠 있는 도구 모음. [카메라: P&ID 빠른 열기·선택 객체로 이동·전체 모델·초기 시점] [패널 열기/닫기] [배치: 겹치기·좌우·상하·복합] [3D⇄도면 동기화] [접기]. 그룹 사이 1px 구분선, 아이콘 위 툴팁.',mo:'버튼 hover 120ms, 레이아웃 전환 즉시, 접기 200ms.',em:'L1',dev:'현재 사이트 기능 그대로 + 패널 열기/닫기 그룹 추가. 그립으로 위치 이동(시안에서는 고정).'},
 'S02-D5-02':{t:'뷰어 패널 열기·닫기·크기·배치',ch:'3D·P&ID·그래프·문서 4개 패널을 독에서 켜고 끔(패널 헤더 ✕로도 닫힘, 최소 1개 유지). 패널 사이 경계를 드래그해 크기 조절(최소 140px). 배치 4종: 복합(3D 크게 + 오른쪽 세로 스택, 기본) / 좌우 / 상하 / 겹치기(탭 전환).',mo:'경계 hover 시 블루 2px 핸들 표시.',em:'L0',dev:'패널 헤더 32px · 13px SemiBold · 패널 유형 아이콘(3D 큐브, 도면 지도, 그래프 노드, 문서). 레이아웃·크기·열린 패널은 사용자별 저장 권장.'},
 'S90-A4-01':{t:'라이트/다크 모드 토글 (해/달)',ch:'헤더 우측, 검색 옆 아이콘 버튼. 라이트일 때 달, 다크일 때 해 아이콘. Start Hub 포함 전체 화면 적용. 다크: 배경 #0f1620 / 표면 #172130 / 선 #2f3d50 / 본문 #e8edf3. Start Hub 다크 배경은 #16275c → #0f1620 세로 그라데이션.',mo:'아이콘 회전+페이드 200ms, 배경·텍스트 색 200ms 전환.',em:'L1',dev:'색은 CSS 변수(--bg, --surface, --line, --text 등)만 바꾸는 방식. 하드코딩 색은 변수로 치환 필요. 사용자별 저장(계정 단위 권장), 기본값 라이트.'},
 'S90-A2-02':{t:'메인 메뉴 드롭다운 — 그룹 표시',ch:'그룹이 하나뿐인 메뉴(자산·스튜디오)는 카테고리명 없이 바로 목록. 그룹이 2개 이상인 메뉴(운영: 운영·자재 / 업무: 업무·마크업)만 카테고리명 + 아래 1px 구분선 + 2열 배치. 현재 페이지에 체크 표시. 선택된 대메뉴는 글자 폭에 맞춘 3px 밑줄(#8fb0ff, 헤더 하단에 붙임).',mo:'클릭으로 열고 바깥 클릭·Esc로 닫힘. opacity+translateY 200ms.',em:'L1',dev:'메뉴 데이터는 좌측 패널(페이지 목록)과 같은 소스 사용.'},
 'S90-B-01':{t:'좌측 레일 이중 모드',ch:'레일 맨 위 ☰ = 현재 섹션의 페이지 목록(2뎁스). 그 아래는 화면별 도구: 워크스페이스=탐색·인스펙터, Live Brief=목차.',mo:'같은 아이콘을 다시 누르면 패널 접힘(width 248→0, 200ms).',em:'L1',dev:'원칙: 상단=어디로(섹션), 왼쪽=여기서 무엇을(페이지·도구). 접힘 상태는 사용자별 저장.'},

 'S90-T-01':{t:'타이포 스케일 (AVEVA 기준 정렬)',ch:'본문 12~13 → 14px, 패널 제목 12 → 15px, 페이지 제목 24px, 9~10px 텍스트 제거(최소 11px).',mo:'—',em:'—',dev:'00 Foundation 2-2 토큰(--fs-*) 사용. rem 정의 권장.'},
 'S00-H-01':{t:'Start Hub (로그인 후 홈)',ch:'로그인 직후 3D 워크스페이스로 바로 들어가던 흐름을 Start Hub로 변경. 시스템 화면 톤: 제목은 페이지 이름 [Start Hub] 34px 중앙 정렬, 인사말·서술형·일시/현장 정보 없음. 배경은 위→아래 그라데이션(#dde3f3 → 720px 지점 #ffffff, 스크롤과 함께 이동). 최근 칩은 회색이 섞인 #f2f4f8 + 테두리 #d3dbe5. 검색창은 완전 라운드 + 아래쪽 옅은 블루→보라 그라데이션 그림자(blur 14px, 불투명도 .55). 구성: 검색·통합 현황·Live Brief 요약·시작 경로(1D 태그/2D 도면/3D)·워크스페이스 카드.',mo:'첫 진입에만 KPI 카운트업 0.8초. 카드 hover 2~4px 상승.',em:'L2(첫 진입 1회) / 그 외 L1',dev:'KPI 숫자는 예시. 데이터 출처(BITHUB/TIM+) R&D 확인 필요.'},

 'S90-A6-01':{t:'사용자 메뉴 › 시작 화면 설정',ch:'Start Hub / 마지막으로 본 화면 / Live Brief 중 선택. 꺼 둔 Start Hub를 다시 켜는 공식 경로.',mo:'선택 즉시 저장, 토스트로 확인.',em:'L1',dev:'관제·대시보드 PC는 Live Brief를 시작 화면으로 지정.'},
 'S00-H-05':{t:'정보 영역 구분 — 현황(읽기) vs 바로 시작(이동)',ch:'세 영역을 같은 섹션 머리(12px 볼드 타이틀 + 1px 하단 라인)로 구분: [연결 현황] · [바로 시작] · [이어서 작업]. 연결 현황은 카드 배경 없이 세로 구분선만 둔 데이터 스트립(클릭 불가로 읽힘). 바로 시작은 흰 카드 + 옅은 그림자 + hover 상승·화살표 강조(클릭 가능으로 읽힘). 시작 경로 카드의 1D/2D/3D 아이콘 삭제.',mo:'바로 시작 카드 hover: 2px 상승, 화살표 --accent + 2px 이동(120ms).',em:'L1',dev:'우측 메타 [BITHUB 동기화 · 시각]은 마지막 집계 시각. 데이터 출처 R&D 확인.'},
 'S00-H-06':{t:'이어서 작업 (최근·즐겨찾기·내 폴더)',ch:'위 영역과 48px 간격. 섹션 타이틀 [이어서 작업] + 오른쪽 텍스트 탭(12px, 선택 시 진한 글자 + 2px 밑줄). 칩형 탭 대신 얇은 라인으로 구분.',mo:'탭 전환 시 카드 목록만 교체.',em:'L1',dev:'최근 = 계정별 최근 열람 8개, 즐겨찾기·내 폴더는 사용자 저장 항목.'},
 'S00-H-04':{t:'Live Brief 요약 카드 (구분 원칙)',ch:'시작 경로 3개(태그·도면·3D)와 한 줄에 배치되는 가로형 카드(2:1:1:1). 내용은 [Live Brief · 시각] 라벨 + "오늘 결정할 일 3건"(숫자 3만 --accent) + [Live Brief 열기]. 카드 좌측 강조 라인 사용 안 함.',mo:'[Live Brief 열기] → S01.',em:'L1',dev:'KPI·흐름도·결정 카드 상세는 넣지 않음.'},

/* ---------- Header nav ---------- */
function renderNav(){
  const nav=$('#nav');nav.innerHTML='';
  NAV.forEach(n=>{
    const it=document.createElement('div');it.className='nav-item'+(state.sec===n.id?' active':'');
    if(n.id==='brief')it.dataset.pin='S90-A2-01';
    if(n.id==='ops')it.dataset.pin='S90-A2-02';
    const b=document.createElement('button');b.className='nav-btn';
    b.innerHTML='<span class="lbl">'+(n.live?'<span class="live-dot warn"></span>':'')+n.label+'</span>'+(n.groups?'<span class="chev">▾</span>':'');
    it.appendChild(b);

function renderRail(){
  const r=$('#rail');const tools=[];
  if(state.sec==='assets'&&state.page==='workspace'){tools.push(['explore',ic.tree,'탐색 패널'],['insp',ic.insp,'인스펙터 패널'])}
  if(state.sec==='brief'){tools.push(['toc',ic.toc,'목차'])}
  const hasPages=!!NAV.find(n=>n.id===state.sec&&n.groups);
  let h='';
  if(hasPages)h+=btn('pages',ic.menu,'페이지 목록');
  if(tools.length){if(hasPages)h+='<div class="div"></div>';h+=tools.map(t=>btn(t[0],t[1],t[2])).join('')}
  r.innerHTML=h;
  r.style.display=(hasPages||tools.length)?'flex':'none';
  r.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(state.railMode===b.dataset.m&&state.lnav){state.lnav=false}else{state.lnav=true;state.railMode=b.dataset.m}
    store.set('lnavOpen',state.lnav?'1':'0');renderRail();renderLnav();
  });
  function btn(m,svg,tip){return '<button data-m="'+m+'" class="'+(state.lnav&&state.railMode===m?'on':'')+'">'+svg+'<span class="tip">'+tip+'</span></button>'}
}
function defaultRailMode(){if(state.sec==='assets'&&state.page==='workspace')return 'explore';if(state.sec==='brief')return 'toc';return 'pages'}

    xs.querySelectorAll('.xsel-menu button').forEach(b=>b.onclick=e=>{e.stopPropagation();state.xscope=b.dataset.x;renderLnav()});

  }else if(state.railMode==='insp'){
    title.textContent='인스펙터 패널';

  }
}

function applyEnvironment(THREE, scene, p, size) {

  if (old) { scene.remove(old); old.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
  const env = new THREE.Group(); env.name = 'env'; scene.add(env);
  const W = size.w, D = size.d, R = Math.max(W, D);
  const C = h => new THREE.Color(h);

    side: THREE.BackSide, depthWrite: false,
    uniforms: { top:{value:C(p.top)}, mid:{value:C(p.horizon)}, bot:{value:C(p.bottom)}, glow:{value:p.glow} },
    vertexShader: 'varying vec3 v; void main(){ v=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top,mid,bot; uniform float glow; varying vec3 v; void main(){ vec3 d=normalize(v);' +
      'vec3 c = d.y>0. ? mix(mid,top,smoothstep(0.,.45,d.y)) : mix(mid,bot,smoothstep(0.,.35,-d.y));' +
      'c += mid*glow*pow(1.-abs(d.y),14.); gl_FragColor=vec4(c,1.); }'
  }));
  sky.renderOrder = -1; env.add(sky);
  const grid = new THREE.Mesh(new THREE.PlaneGeometry(R * 7, R * 7), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, extensions: { derivatives: true },
    uniforms: { col:{value:C(p.grid)}, op:{value:p.gridOpacity}, cell:{value:R / 24}, fade:{value:R * 2.2} },
    vertexShader: 'varying vec3 w; void main(){ w=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(w,1.); }',
    fragmentShader: 'uniform vec3 col; uniform float op,cell,fade; varying vec3 w;' +
      'float L(float s){ vec2 q=w.xz/s; vec2 g=abs(fract(q-.5)-.5)/fwidth(q); return 1.-min(min(g.x,g.y),1.); }' +
      'void main(){ float a=max(L(cell)*.45, L(cell*5.))*op*pow(clamp(1.-length(w.xz)/fade,0.,1.),1.5); gl_FragColor=vec4(col,a); }'
  }));
  grid.rotation.x = -Math.PI / 2; grid.position.y = -1.3; env.add(grid);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(W, 1.2, D), new THREE.MeshStandardMaterial({ color: C(p.ground), roughness: .85, metalness: .1 }));
  slab.position.y = -.62; slab.receiveShadow = true; env.add(slab);
  if (p.edge) { const line = new THREE.LineSegments(new THREE.EdgesGeometry(slab.geometry), new THREE.LineBasicMaterial({ color: C(p.edge) })); line.position.copy(slab.position); env.add(line); }
  env.add(new THREE.HemisphereLight(0xffffff, C(p.bottom).lerp(C('#8899bb'), .5), p.amb));
  const sun = new THREE.DirectionalLight(0xffffff, p.sun);
  sun.position.set(R * .4, R * .9, R * .5); sun.castShadow = p.shadow > 0;
  Object.assign(sun.shadow.camera, { left:-R*.8, right:R*.8, top:R*.8, bottom:-R*.8, far:R*3 });
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005; env.add(sun);
  if (p.shadow > 0) { const sh = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.ShadowMaterial({ opacity: p.shadow })); sh.rotation.x = -Math.PI / 2; sh.position.y = .01; sh.receiveShadow = true; env.add(sh); slab.receiveShadow = false; }
  scene.fog = p.fog ? new THREE.FogExp2(C(p.horizon), p.fog * 60 / R) : null;
}

function route(){
  const h=location.hash||'#/start';
  if(h.startsWith('#/login')){showLogin();return}
  const parts=h.slice(2).split('?')[0].split('/');
  const prevSec=state.sec,prevPage=state.page;
  let html='';
  if(parts[0]==='start'||parts[0]===''){state.sec='start';state.page=null;html=V.start()}
  else if(parts[0]==='brief'){state.sec='brief';state.page='brief';html=V.brief()}
  else{const p=findPage(parts[0],parts[1]);if(!p){location.hash='#/start';return}state.sec=parts[0];state.page=parts[1];html=(V[parts[1]]||V.generic)(p)}
  if(prevSec!==state.sec||prevPage!==state.page){state.railMode=defaultRailMode();if(state.page==='3d-studio')state.lnav=false}
  if(state.sec!=='start'){store.set('lastRoute',h)}
  document.body.classList.remove('display-mode');
  stop3D();
  $('#main').classList.toggle('m-start',state.sec==='start');$('#main').innerHTML='<div class="view">'+html+'</div>';$('#main').scrollTop=0;
  renderNav();renderRail();renderLnav();bindView();placePins();
}
function bindView(){
  const sw=$('#hubSwitch');
  if(sw)sw.onclick=()=>{const on=!sw.classList.contains('on');setStartPref(on?'hub':'last',true);if(!on)toast('다음 로그인부터 마지막으로 본 화면이 열려요. 사용자 메뉴 › 시작 화면에서 다시 켤 수 있어요.','되돌리기',()=>setStartPref('hub',true));else toast('다음 로그인부터 Start Hub가 열려요.')};
  document.querySelectorAll('.htab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.htab').forEach(x=>x.classList.toggle('on',x===t))});
  const hs=$('#hubSearch');if(hs)hs.onclick=()=>toast('통합 검색 오버레이는 2차 항목(S90-A3-01)이에요.');
  const kp=document.querySelectorAll('.kpi b[data-to]');
  if(kp.length){const first=!sessionStorageSafe('hubSeen');kp.forEach(b=>{const to=+b.dataset.to;if(!first){b.textContent=to.toLocaleString();return}const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/800);const e=1-Math.pow(1-k,3);b.textContent=Math.round(to*e).toLocaleString();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
  init3D();initWS();initMinimap();initDwg();init3DLens();bindOrb();initStudio();
  const db=$('#dispBtn');if(db)db.onclick=()=>{document.body.classList.toggle('display-mode');db.textContent=document.body.classList.contains('display-mode')?'⤡ 기본 크기':'⤢ 표시 모드';setTimeout(placePins,50)};
}
function sessionStorageSafe(k){try{const v=sessionStorage.getItem(k);sessionStorage.setItem(k,'1');return v}catch(e){const v=mem['ss'+k];mem['ss'+k]='1';return v}}

/* ---------- Login simulation ---------- */
function showLogin(){$('#login').classList.add('show');setTimeout(placePins,50)}
$('#loginBtn').onclick=()=>{$('#login').classList.remove('show');try{sessionStorage.removeItem('hubSeen')}catch(e){delete mem['sshubSeen']}const p=startPref();location.hash=p==='hub'?'#/start':p==='brief'?'#/brief':(store.get('lastRoute','#/assets/workspace'));route()};

/* ---------- Toast ---------- */
let tt;function toast(msg,act,fn){$('#toastMsg').textContent=msg;const b=$('#toastAct');b.style.display=act?'block':'none';b.textContent=act||'';b.onclick=()=>{fn&&fn();$('#toast').classList.remove('show')};$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),4000)}

/* ---------- Annotation ---------- */
let anno=false,selPin=null;
$('#annoBtn').onclick=()=>{anno=!anno;document.body.classList.toggle('anno-on',anno);setTimeout(placePins,220)};
function placePins(){
  document.querySelectorAll('.pin').forEach(p=>p.remove());
  const loginOn=$('#login').classList.contains('show');const els=[...document.querySelectorAll('[data-pin]')].filter(e=>loginOn?!!e.closest('.login'):(e.offsetParent!==null&&!e.closest('.login')));
  const ids=[...new Set(els.map(e=>e.dataset.pin))];
  $('#annoCnt').textContent=ids.length;
  $('#drawerBd').innerHTML=ids.map(id=>{const n=NOTES[id]||{t:id};return `<div class="note ${selPin===id?'sel':''}" data-id="${id}"><span class="id">${id}</span><h4>${n.t}</h4><dl><dt>변경</dt><dd>${n.ch||''}</dd><dt>동작</dt><dd>${n.mo||''}</dd><dt>감성</dt><dd>${n.em||''}</dd><dt>개발 메모</dt><dd>${n.dev||''}</dd></dl></div>`}).join('');
  $('#drawerBd').querySelectorAll('.note').forEach(n=>n.onclick=()=>selectPin(n.dataset.id,true));
  if(!anno)return;
  const seen={};
  els.forEach(e=>{const id=e.dataset.pin;if(seen[id])return;seen[id]=1;const r=e.getBoundingClientRect();if(r.width===0)return;const p=document.createElement('div');p.className='pin'+(selPin===id?' sel':'');p.textContent=id;p.style.left=Math.max(4,Math.min(innerWidth-120,r.left+4))+'px';p.style.top=Math.max(4,r.top+4)+'px';p.onclick=ev=>{ev.stopPropagation();selectPin(id,false)};document.body.appendChild(p)});
}
function selectPin(id,scrollTo){selPin=id;placePins();const n=document.querySelector('.note[data-id="'+id+'"]');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'});if(scrollTo){const el=document.querySelector('[data-pin="'+id+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(placePins,350)}}
addEventListener('resize',()=>placePins());
$('#main').addEventListener('scroll',()=>{if(anno)placePins()});
addEventListener('hashchange',route);

/* ---------- Init ---------- */
setStartPref(startPref(),true);
const PIN_SCREEN={'S05-H-01':'#/studio/3d-studio','S05-H-02':'#/studio/3d-studio','S05-H-03':'#/studio/3d-studio','S02-D3-01':'#/assets/workspace','S00-1-01':'#/login','S00-H-01':'#/start','S00-H-03':'#/start','S00-H-04':'#/start','S00-H-05':'#/start','S00-H-06':'#/start','S90-T-01':'#/start','S01-D-01':'#/brief','S90-B-02':'#/ops/alarms','S90-Z-05':'#/ops/alarms','S90-B-01':'#/assets/workspace','S90-A4-01':'#/start','S02-C1-01':'#/assets/workspace','S02-C3-01':'#/assets/workspace','S02-D4-01':'#/assets/workspace','S02-D3-02':'#/assets/workspace','S02-E-01':'#/assets/workspace','S90-G-02':'#/assets/workspace','S90-D6-02':'#/assets/workspace','S90-G-01':'#/assets/workspace','S90-G-03':'#/assets/workspace','S90-G6-01':'#/assets/workspace','S90-G-04':'#/assets/workspace','S90-G-05':'#/assets/workspace','S02-E-02':'#/assets/workspace','S02-E-03':'#/assets/workspace','S02-P-01':'#/assets/workspace','S02-D3-03':'#/assets/workspace','S02-D5-01':'#/assets/workspace','S02-D5-02':'#/assets/workspace','S90-A2-02':'#/ops/alarms'};
let deep=(location.hash.match(/[?&]pin=([\w-]+)/)||[])[1];
const pm=location.hash.match(/^#pin-([\w-]+)$/);
if(pm){deep=pm[1];const scr=PIN_SCREEN[deep]||'#/start';history.replaceState(null,'',scr==='#/login'?'#/start':scr);if(scr==='#/login')showLogin()}
else if(!location.hash){showLogin()}
route();
if(deep&&/^S90-(G|D6)/.test(deep)){const inPanel=/^S90-G(-0[2-5]|6)/.test(deep);setTimeout(()=>{bbxToggle(true);if(deep!=='S90-G-02'&&deep!=='S90-G-05')ask(deep==='S90-G-01'||deep==='S90-D6-02'?'CCWP A를 멈추면 영향받는 설비는?':'CCWP A 진동이 높은 원인 후보는?')},inPanel?200:900)}
if(deep){anno=true;document.body.classList.add('anno-on');setTimeout(()=>selectPin(deep,true),/^S90-(G|D6)/.test(deep)&&!/^S90-G-0[25]$/.test(deep)?5200:600)}
</script>
</body>
